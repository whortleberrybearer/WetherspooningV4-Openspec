name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Functions)
          run: |
            cd functions
            npm ci

        - name: Build Functions
          run: |
            cd functions
            npm run build

      - name: Install dependencies (Web)
          run: |
            cd Wetherspooning
            npm ci

        - name: Build Wetherspooning Website
          run: |
            cd Wetherspooning
            npm run build

