name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Create .env for Functions
        run: |
          echo "GOOGLE_GEOCODING_API_KEY=${{ secrets.GOOGLE_GEOCODING_API_KEY }}" > $GITHUB_WORKSPACE/functions/.env

      - name: Install dependencies (Functions)
        run: |
          cd $GITHUB_WORKSPACE/functions && npm ci

      - name: Build Functions
        run: |
          cd $GITHUB_WORKSPACE/functions && npm run build

      - name: Create .env.production for Website
        run: |
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" > $GITHUB_WORKSPACE/Wetherspooning/.env.production
          echo "VITE_GOOGLE_MAPS_MAP_ID=${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" >> $GITHUB_WORKSPACE/Wetherspooning/.env.production
          echo "VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}" >> $GITHUB_WORKSPACE/Wetherspooning/.env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" >> $GITHUB_WORKSPACE/Wetherspooning/.env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}" >> $GITHUB_WORKSPACE/Wetherspooning/.env.production
          echo "VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}" >> $GITHUB_WORKSPACE/Wetherspooning/.env.production

      - name: Install dependencies (Web)
        run: |
          cd $GITHUB_WORKSPACE/Wetherspooning && npm ci

      - name: Build Wetherspooning Website
        run: |
          cd $GITHUB_WORKSPACE/Wetherspooning && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WETHERSPOONING_LIVE }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}